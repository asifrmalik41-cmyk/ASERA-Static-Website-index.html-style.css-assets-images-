<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASERA — A Universe Built by One Soul</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #f5f2ea;
      font-family: Georgia, "Times New Roman", serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;

      background:
        radial-gradient(
          circle at 50% 35%,
          #2a2418 0%,
          #0b0b0a 35%,
          #050505 70%
        );
    }

    .content {
      max-width: 850px;
    }

    .mark {
      color: #d6b46a;
      font-size: 14px;
      letter-spacing: 7px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 100px);
      letter-spacing: 10px;
      margin: 0;
      font-weight: 400;
    }

    .line {
      width: 90px;
      height: 1px;
      background: #d6b46a;
      margin: 32px auto;
    }

    .tagline {
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 3px;
      color: #d6b46a;
    }

    .principles {
      margin-top: 45px;
      font-size: 15px;
      letter-spacing: 4px;
      color: #c9c5bb;
    }

    .welcome {
      margin-top: 60px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: #99958d;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <div class="mark">
        THE KINGDOM OF ASERA
      </div>

      <h1>ASERA</h1>

      <div class="line"></div>

      <div class="tagline">
        A UNIVERSE BUILT BY ONE SOUL
      </div>

      <div class="principles">
        LIGHT • KNOWLEDGE • GRACE
      </div>

      <div class="welcome">
        THE FUTURE BEGINS WITH A VISION
      </div>

    </div>

  </section>

</body>
  </html>
